name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev

    - name: Install buildozer and cython
      run: |
        pip install buildozer cython

    - name: Configure buildozer
      run: |
        buildozer init
        sed -i 's/title = My Application/title = Моя математика ЕГЭ/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = mathege/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests/' buildozer.spec
        echo "android.build_tools = 34.0.0" >> buildozer.spec
        sed -i 's/# android.api = 31/android.api = 31/' buildozer.spec
        sed -i 's/# android.minapi = 21/android.minapi = 21/' buildozer.spec
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/# android.permissions =/android.permissions = android.permission.INTERNET/' buildozer.spec
        echo "icon.filename = icon.png" >> buildozer.spec

    - name: Accept SDK licenses
      run: |
        yes | buildozer android debug --no-sdk-update || true
        yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

    - name: Build APK
      run: |
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
